<!-- Apple Liquid Glass: Optical Refraction Filter (SVG Displacement Map) -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <filter id="liquid-glass-refraction" x="-20%" y="-20%" width="140%" height="140%">
    <feDisplacementMap 
      in="SourceGraphic" 
      in2="SourceGraphic" 
      xChannelSelector="R" 
      yChannelSelector="G" 
      scale="12" 
      color-interpolation-filters="sRGB"
    />
    <feGaussianBlur stdDeviation="0.5" result="blur"/>
    <feBlend in="SourceGraphic" in2="blur" mode="normal"/>
  </filter>
</svg>

<canvas id="chromatic-mesh" aria-hidden="true"></canvas>

<!-- Apple Liquid Glass: Chromatic Mesh & Specular Sheen & Displacement Map JS -->
<script>
(function() {
  'use strict';
  
  // ─── Displacement Map Generation (Convex Squircle Bezel) ───
  function generateDisplacementMap() {
    const size = 512;
    const canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext('2d');
    const data = ctx.createImageData(size, size);
    const pixels = data.data;
    
    const center = size / 2;
    const radius = center * 0.92;
    const bezelWidth = center * 0.08;
    
    // Convex Squircle profile: y = (1 - (1 - x)^4)^(1/4)
    function squircleProfile(t) {
      const x = 1 - t;
      return Math.pow(1 - Math.pow(x, 4), 0.25);
    }
    
    for (let y = 0; y < size; y++) {
      for (let x = 0; x < size; x++) {
        const dx = x - center;
        const dy = y - center;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const angle = Math.atan2(dy, dx);
        
        let displacement = 0;
        
        if (dist < radius - bezelWidth) {
          // Center: flat glass, no displacement
          displacement = 0;
        } else if (dist <= radius) {
          // Bezel: Convex Squircle profile for optical refraction
          const t = (dist - (radius - bezelWidth)) / bezelWidth;
          const profile = squircleProfile(t);
          displacement = profile * bezelWidth * 0.6;
        } else {
          // Outside: no displacement
          displacement = 0;
        }
        
        const dX = Math.cos(angle) * displacement;
        const dY = Math.sin(angle) * displacement;
        
        // Encode to R (X) and G (Y) channels: 128 = neutral, ±127 = max displacement
        const r = Math.max(0, Math.min(255, 128 + dX * 127 / (bezelWidth * 0.6)));
        const g = Math.max(0, Math.min(255, 128 + dY * 127 / (bezelWidth * 0.6)));
        
        const i = (y * size + x) * 4;
        pixels[i] = r;       // R = X displacement
        pixels[i + 1] = g;   // G = Y displacement
        pixels[i + 2] = 128; // B = neutral
        pixels[i + 3] = 255; // A = opaque
      }
    }
    
    ctx.putImageData(data, 0, 0);
    return canvas.toDataURL('image/png');
  }
  
  // Generate and inject displacement map into the filter
  const displacementDataUrl = generateDisplacementMap();
  const filter = document.getElementById('liquid-glass-refraction');
  if (filter) {
    const feDisplacementMap = filter.querySelector('feDisplacementMap');
    if (feDisplacementMap) {
      feDisplacementMap.setAttribute('in2', displacementDataUrl);
    }
  }
  
  // ─── Chromatic Mesh Animation ───
  const meshCanvas = document.getElementById('chromatic-mesh');
  const meshCtx = meshCanvas.getContext('2d');
  let meshWidth = 0, meshHeight = 0;
  let orbs = [];
  let meshAnimationId = null;
  
  function meshResize() {
    meshWidth = window.innerWidth;
    meshHeight = window.innerHeight;
    meshCanvas.width = meshWidth * devicePixelRatio;
    meshCanvas.height = meshHeight * devicePixelRatio;
    meshCanvas.style.width = meshWidth + 'px';
    meshCanvas.style.height = meshHeight + 'px';
    meshCtx.scale(devicePixelRatio, devicePixelRatio);
    initOrbs();
  }
  
  function initOrbs() {
    orbs = [];
    const count = Math.min(6, Math.max(3, Math.floor((meshWidth * meshHeight) / 150000)));
    const colors = [
      { r: 99, g: 102, b: 241 },   // #6366f1 - Deep Purple
      { r: 236, g: 72, b: 153 },   // #ec4899 - Pink
      { r: 59, g: 130, b: 246 },   // #3b82f6 - Blue
    ];
    
    for (let i = 0; i < count; i++) {
      const color = colors[i % colors.length];
      orbs.push({
        x: Math.random() * meshWidth,
        y: Math.random() * meshHeight,
        radius: Math.max(200, Math.min(400, Math.random() * 300 + 200)),
        vx: (Math.random() - 0.5) * 0.25,
        vy: (Math.random() - 0.5) * 0.25,
        color: color,
        alpha: 0.06 + Math.random() * 0.04
      });
    }
  }
  
  function animateMesh() {
    meshCtx.clearRect(0, 0, meshWidth, meshHeight);
    
    for (const orb of orbs) {
      orb.x += orb.vx;
      orb.y += orb.vy;
      
      const margin = orb.radius;
      if (orb.x < margin || orb.x > meshWidth - margin) orb.vx *= -1;
      if (orb.y < margin || orb.y > meshHeight - margin) orb.vy *= -1;
      
      const gradient = meshCtx.createRadialGradient(orb.x, orb.y, 0, orb.x, orb.y, orb.radius);
      gradient.addColorStop(0, `rgba(${orb.color.r}, ${orb.color.g}, ${orb.color.b}, ${orb.alpha})`);
      gradient.addColorStop(0.5, `rgba(${orb.color.r}, ${orb.color.g}, ${orb.color.b}, ${orb.alpha * 0.3})`);
      gradient.addColorStop(1, `rgba(${orb.color.r}, ${orb.color.g}, ${orb.color.b}, 0)`);
      
      meshCtx.beginPath();
      meshCtx.arc(orb.x, orb.y, orb.radius, 0, Math.PI * 2);
      meshCtx.fillStyle = gradient;
      meshCtx.fill();
    }
    
    meshAnimationId = requestAnimationFrame(animateMesh);
  }
  
  // ─── Specular Sheen (mouse-following) ───
  const sheen = document.getElementById('specular-sheen');
  let mouseX = 0, mouseY = 0;
  let targetX = 0, targetY = 0;
  let sheenAnimationId = null;
  
  function updateSheenPosition() {
    targetX += (mouseX - targetX) * 0.15;
    targetY += (mouseY - targetY) * 0.15;
    
    document.documentElement.style.setProperty('--mx', targetX + 'px');
    document.documentElement.style.setProperty('--my', targetY + 'px');
    
    sheenAnimationId = requestAnimationFrame(updateSheenPosition);
  }
  
  document.addEventListener('mousemove', (e) => {
    mouseX = e.clientX;
    mouseY = e.clientY;
    sheen.classList.add('active');
  });
  
  document.addEventListener('mouseleave', () => {
    sheen.classList.remove('active');
  });
  
  document.addEventListener('touchmove', (e) => {
    if (e.touches[0]) {
      mouseX = e.touches[0].clientX;
      mouseY = e.touches[0].clientY;
      sheen.classList.add('active');
    }
  }, { passive: true });
  
  document.addEventListener('touchend', () => {
    sheen.classList.remove('active');
  });
  
  // ─── Initialize All ───
  function init() {
    meshResize();
    window.addEventListener('resize', meshResize);
    animateMesh();
    updateSheenPosition();
  }
  
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
  
  window.addEventListener('beforeunload', () => {
    cancelAnimationFrame(meshAnimationId);
    cancelAnimationFrame(sheenAnimationId);
    window.removeEventListener('resize', meshResize);
  });
})();
</script>
</body>
</html>
