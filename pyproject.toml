[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shirim"
version = "1.4.3"
description = "Shirim music app"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "yt-dlp",
    "requests",
    "ytmusicapi",
    "mutagen",
    "pywebview",
    "certifi",
    "websockets",
    "brotli",
    "curl-cffi",
    "urllib3",
    "qrcode",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["core"]
include = ["shirim*"]
